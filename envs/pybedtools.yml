name: pybedtools
# Was a full `conda env export` with build strings, which could not take another package: adding
# ucsc-bedgraphtobigwig pulled mysql-connector-c and conflicted with the pinned openssl/libstdcxx.
# Kept as a minimal spec at the same versions instead. Backs the rules needing bedtools, samtools,
# bgzip/tabix, or bedGraphToBigWig (scripts/BamToBigwig.sh needs the last three together).
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pybedtools=0.12.0
  - pysam=0.23.0
  - pandas=2.2.3
  - numpy=2.2
  - bedtools=2.31.1
  - samtools=1.21
  - htslib=1.21
  - ucsc-bedgraphtobigwig
